# Backend per dispositivo: zita oppure alsa.
# Cambiare qui le impostazioni; saranno applicate al prossimo avvio dei driver.
# I nomi JACK rimangono uguali con entrambi i backend.
UMC_BACKEND=${UMC_BACKEND:-zita}
A100_BACKEND=${A100_BACKEND:-zita}
HDMI_BACKEND=${HDMI_BACKEND:-zita}
# Override opzionali per direzione / uscita.
A100_IN_BACKEND=${A100_IN_BACKEND:-$A100_BACKEND}
A100_OUT_BACKEND=${A100_OUT_BACKEND:-$A100_BACKEND}
HDMI_HEAD_BACKEND=${HDMI_HEAD_BACKEND:-$HDMI_BACKEND}
HDMI_SPKR_BACKEND=${HDMI_SPKR_BACKEND:-$HDMI_BACKEND}

UMC_ENABLED=${UMC_ENABLED:-1}
A100_ENABLED=${A100_ENABLED:-1}
HDMI_ENABLED=${HDMI_ENABLED:-1}
MIDI_ENABLED=${MIDI_ENABLED:-1}
RESTORE_ALSA_STATE=${RESTORE_ALSA_STATE:-1}
AUDIO_RATE=${AUDIO_RATE:-48000}
ALSA_QUALITY=${ALSA_QUALITY:-2}
BRIDGE_TRACE=${BRIDGE_TRACE:-0}

UMC_DEVICE=${UMC_DEVICE:-hw:CARD=U192k,DEV=0}
UMC_PERIOD=${UMC_PERIOD:-256}
UMC_PERIODS=${UMC_PERIODS:-2}
A100_DEVICE=${A100_DEVICE:-hw:CARD=Device,DEV=0}
A100_PERIOD=${A100_PERIOD:-256}
A100_PERIODS=${A100_PERIODS:-2}
# Nuovo PC: i due monitor LG sono sulle uscite DisplayPort della GPU NVIDIA.
HDMI_HEAD_DEVICE=${HDMI_HEAD_DEVICE:-hdmi:CARD=NVidia,DEV=0}
HDMI_SPKR_DEVICE=${HDMI_SPKR_DEVICE:-hdmi:CARD=NVidia,DEV=1}
HDMI_PERIOD=${HDMI_PERIOD:-256}
HDMI_PERIODS=${HDMI_PERIODS:-4}

# Monitor Zita: soglie conservative, configurabili (secondi / campioni / ppm).
MONITOR_ENABLED=${MONITOR_ENABLED:-1}
MONITOR_AUTO_RESTART=${MONITOR_AUTO_RESTART:-1}
MONITOR_WARMUP=${MONITOR_WARMUP:-30}
MONITOR_SUSTAIN=${MONITOR_SUSTAIN:-10}
MONITOR_ERROR_SAMPLES=${MONITOR_ERROR_SAMPLES:-64}
MONITOR_RATIO_SPAN_PPM=${MONITOR_RATIO_SPAN_PPM:-1000}
MONITOR_RATIO_LIMIT_PPM=${MONITOR_RATIO_LIMIT_PPM:-10000}
MONITOR_COOLDOWN=${MONITOR_COOLDOWN:-60}
MONITOR_MAX_RESTARTS=${MONITOR_MAX_RESTARTS:-3}
MONITOR_RESTART_WINDOW=${MONITOR_RESTART_WINDOW:-600}

# Collegamento automatico Jamulus ↔ Ardour, senza avviare il client Jamulus.
JAMULUS_ENABLED=${JAMULUS_ENABLED:-1}
JAMULUS_CLIENT=${JAMULUS_CLIENT:-Jamulus}
JAMULUS_DAW_CLIENT=${JAMULUS_DAW_CLIENT:-ardour}
JAMULUS_INPUT_TRACK=${JAMULUS_INPUT_TRACK:-Jamulus OUT}
JAMULUS_OUTPUT_BUS=${JAMULUS_OUTPUT_BUS:-Jamulus IN}
# Elimina solo gli agganci hardware automatici di Jamulus dopo il routing DAW.
JAMULUS_REMOVE_SYSTEM=${JAMULUS_REMOVE_SYSTEM:-1}

# Collegamento automatico JackTrip ↔ Ardour, indipendente dal client.
JACKTRIP_ENABLED=${JACKTRIP_ENABLED:-1}
JACKTRIP_CLIENT=${JACKTRIP_CLIENT:-JackTrip}
JACKTRIP_DAW_CLIENT=${JACKTRIP_DAW_CLIENT:-ardour}
JACKTRIP_INPUT_TRACK=${JACKTRIP_INPUT_TRACK:-FR Jacktrip}
JACKTRIP_OUTPUT_BUS=${JACKTRIP_OUTPUT_BUS:-TO JackTrip}
JACKTRIP_REMOVE_SYSTEM=${JACKTRIP_REMOVE_SYSTEM:-1}

# Collegamento automatico Carla esterna ↔ Ardour, senza avviare Carla.
CARLA_ENABLED=${CARLA_ENABLED:-1}
CARLA_CLIENT=${CARLA_CLIENT:-Carla}
CARLA_DAW_CLIENT=${CARLA_DAW_CLIENT:-ardour}
CARLA_INPUT_TRACK=${CARLA_INPUT_TRACK:-Carla OUT}
CARLA_OUTPUT_BUS=${CARLA_OUTPUT_BUS:-Carla IN}
CARLA_REMOVE_SYSTEM=${CARLA_REMOVE_SYSTEM:-1}

# Sonicake Pocket Master USB: stereo 16 bit, frequenza hardware 44,1 kHz.
# Zita ricampiona verso la frequenza del server JACK senza cambiarla.
POCKET_MASTER_ENABLED=${POCKET_MASTER_ENABLED:-1}
POCKET_MASTER_BACKEND=${POCKET_MASTER_BACKEND:-zita}
POCKET_MASTER_IN_BACKEND=${POCKET_MASTER_IN_BACKEND:-$POCKET_MASTER_BACKEND}
POCKET_MASTER_OUT_BACKEND=${POCKET_MASTER_OUT_BACKEND:-$POCKET_MASTER_BACKEND}
POCKET_MASTER_DEVICE=${POCKET_MASTER_DEVICE:-hw:CARD=Master,DEV=0}
POCKET_MASTER_RATE=${POCKET_MASTER_RATE:-44100}
POCKET_MASTER_PERIOD=${POCKET_MASTER_PERIOD:-256}
POCKET_MASTER_PERIODS=${POCKET_MASTER_PERIODS:-2}

# MeloAudio Tone Shifter Mega: ingresso chitarra L, secondo ingresso R,
# uscita stereo. Formato nativo 24 bit in S32_LE, senza forzatura a 16 bit.
TSMEGA_ENABLED=${TSMEGA_ENABLED:-1}
TSMEGA_BACKEND=${TSMEGA_BACKEND:-zita}
TSMEGA_IN_BACKEND=${TSMEGA_IN_BACKEND:-$TSMEGA_BACKEND}
TSMEGA_OUT_BACKEND=${TSMEGA_OUT_BACKEND:-$TSMEGA_BACKEND}
TSMEGA_DEVICE=${TSMEGA_DEVICE:-hw:CARD=TSMEGA,DEV=0}
TSMEGA_RATE=${TSMEGA_RATE:-48000}
TSMEGA_PERIOD=${TSMEGA_PERIOD:-256}
TSMEGA_PERIODS=${TSMEGA_PERIODS:-2}
TSMEGA_TONELIB_ENABLED=${TSMEGA_TONELIB_ENABLED:-1}
